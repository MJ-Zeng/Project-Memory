name: test

on:
  push:
    branches: [dev/v1.0]
  pull_request:
    branches: [dev/v1.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Default gate
        shell: bash
        run: python -m pytest -q
      - name: OpenSSL gate
        shell: bash
        run: |
          if ! command -v openssl >/dev/null 2>&1; then
            echo "::error::runner 上没有 openssl；PROJECT_MEMORY_REQUIRE_OPENSSL 门禁无法执行"
            exit 1
          fi
          echo "openssl available: $(openssl version)"
          PROJECT_MEMORY_REQUIRE_OPENSSL=1 python -m pytest -q

  packaging:
    # 装得起不等于用得起：wheel 必须自带 Skill，且 pip 装完后 init 能跑通。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build sdist and wheel
        shell: bash
        run: python -m build
      - name: Wheel must carry the Skill tree
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as z:
              names = z.namelist()
          target = 'project_memory/_skill/project-memory/SKILL.md'
          if target not in names:
              raise SystemExit(f'wheel 缺少 {target}；pip 安装后 init 会失败')
          print('wheel skill files:', sum(1 for n in names if '/_skill/' in n))
          PY
      - name: Clean venv install then init round trip
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          python -m venv "$RUNNER_TEMP/pmvenv"
          if [ -d "$RUNNER_TEMP/pmvenv/Scripts" ]; then
            vpy="$RUNNER_TEMP/pmvenv/Scripts/python.exe"
            launch="$RUNNER_TEMP/pmvenv/Scripts/project-memory.cmd"
          else
            vpy="$RUNNER_TEMP/pmvenv/bin/python"
            launch="$RUNNER_TEMP/pmvenv/bin/project-memory"
          fi
          "$vpy" -m pip install --disable-pip-version-check --no-index "$wheel"
          # 离开检出目录：cwd 里的源码包会与 site-packages 副本同名，触发 B5A 守卫。
          cd "$RUNNER_TEMP"
          "$vpy" -m project_memory --version
          mkdir pmtarget
          git init -q pmtarget
          git -C pmtarget config user.email ci@example.invalid
          git -C pmtarget config user.name ci
          printf 'x = 1\n' > pmtarget/main.py
          git -C pmtarget add main.py
          git -C pmtarget commit -qm init
          "$vpy" -m project_memory init --repo "$RUNNER_TEMP/pmtarget" --install both
          test -f pmtarget/.agents/skills/project-memory/SKILL.md
          test -f pmtarget/.claude/skills/project-memory/SKILL.md
          test -f pmtarget/.project-memory/tooling/project_memory/__init__.py
          "$launch" audit --repo "$RUNNER_TEMP/pmtarget" --scope current --fail-on high
          "$launch" search --repo "$RUNNER_TEMP/pmtarget" '状态'
      - name: Run the suite from the extracted sdist
        # 清单漏一个目录，从 sdist 构建出的 wheel 和跑起来的测试就会缺料；
        # 内容检查抓不到这种漏，只有真的在 sdist 里跑一遍才算证明。
        # sdist 内容与平台无关，wheel 安装与 init 往返已经在两个平台各跑一次。
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.1.1
          mkdir "$RUNNER_TEMP/pmsdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/pmsdist"
          cd "$RUNNER_TEMP/pmsdist"/project_memory_skill-*
          python -m pytest -q
