name: 项目记忆审计

on:
  push:
    branches: [dev/v1.0]
  pull_request:
    branches: [dev/v1.0]

permissions:
  contents: read

jobs:
  knowledge:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # 本仓库是工具源码仓，tooling/ 被 .gitignore 排除；直接用仓库自身源码审计。
      - name: 审计当前知识
        run: python -m project_memory audit --repo . --scope current --fail-on high