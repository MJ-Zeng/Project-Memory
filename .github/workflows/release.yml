name: release

# S4-3: release *build* only.  This workflow never creates a tag, never
# publishes a GitHub Release and reads no repository secret; publishing stays a
# human action (S4-5).  A version tag push or a manual dispatch are the only
# entries, so unmerged PR code is never built here and no secret is reachable.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '可选：从指定 tag 构建；留空则构建当前 dispatch ref'
        required: false
        default: ''

# contents: read   - checkout only, nothing is written back to the repository.
# id-token: write  - the OIDC token artifact attestation is signed with.
# attestations: write - uploading the attestation to the attestations service.
# No `contents: write`: the built artifacts go to the artifact store, not to a
# Release, and there is nothing here that needs write access to the repository.
permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Artifact attestation is only available on GitHub-hosted runners, so this
    # job deliberately does not follow the windows-latest choice of the test
    # gate; ubuntu-latest is also the environment the attest/verify tooling is
    # documented against.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth 0 is required because `git archive` needs the full object
      # store of the commit being packaged.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: resolve build ref
        shell: bash
        env:
          PM_INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pm_build_ref="$GITHUB_REF"
          if [ -n "${PM_INPUT_TAG}" ]; then
            # Only a bare tag name is accepted: a newline or a crafted ref here
            # would otherwise reach both `git fetch` and $GITHUB_ENV.
            if ! printf '%s' "${PM_INPUT_TAG}" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$'; then
              echo "::error::tag 输入必须是裸 tag 名（字母/数字/._- 开头不含斜杠与空白），收到：${PM_INPUT_TAG}"
              exit 1
            fi
            git fetch -q origin "+refs/tags/${PM_INPUT_TAG}:refs/tags/${PM_INPUT_TAG}"
            git checkout -q --detach "refs/tags/${PM_INPUT_TAG}"
            pm_build_ref="refs/tags/${PM_INPUT_TAG}"
          fi
          {
            echo "PM_BUILD_SHA=$(git rev-parse 'HEAD^{commit}')"
            echo "PM_BUILD_TREE=$(git rev-parse 'HEAD^{tree}')"
            echo "PM_BUILD_REF=${pm_build_ref}"
            echo "PM_SHORT_SHA=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_ENV"
          # Self-reported bookkeeping only: the workflow run's own commit
          # (GITHUB_SHA) is the ref that decided this file, which differs from
          # the built commit when a tag input was given.
          echo "| field | value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| built commit | $(git rev-parse 'HEAD^{commit}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| built tree | $(git rev-parse 'HEAD^{tree}') |" >> "$GITHUB_STEP_SUMMARY"
          echo "| built ref | ${pm_build_ref} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| event | ${GITHUB_EVENT_NAME} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| workflow commit | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build
      - name: Build sdist, wheel and source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist attestation
          python -m build
          git archive --format=tar.gz \
            --prefix="project-memory-${PM_SHORT_SHA}/" \
            "$PM_BUILD_SHA" -o "dist/project-memory-${PM_SHORT_SHA}-source.tar.gz"
          find dist -maxdepth 1 -type f -printf '%f %s bytes\n' | LC_ALL=C sort
      - name: Write BUILD-INFO.json
        shell: bash
        run: |
          set -euo pipefail
          # Plain assignments, so a failing probe aborts the step instead of
          # recording an empty version that nobody would notice.
          pm_python_version="$(python -c 'import sys; print(sys.version.split()[0])')"
          pm_build_version="$(python -m build --version)"
          pm_generated_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for pair in "python_version=${pm_python_version}" "build_version=${pm_build_version}" "generated_at=${pm_generated_at}"; do
            if [ -z "${pair#*=}" ]; then
              echo "::error::构建信息字段 ${pair%%=*} 取值为空，拒绝写出自称的 BUILD-INFO"
              exit 1
            fi
          done
          export PM_PYTHON_VERSION="${pm_python_version}"
          export PM_BUILD_VERSION="${pm_build_version}"
          export PM_GENERATED_AT="${pm_generated_at}"
          python - <<'PY'
          import json, os, pathlib

          dist = pathlib.Path('dist')
          info = {
              'schema_version': '1.0',
              'kind': 'project_memory_release_build_info',
              'commit_sha': os.environ['PM_BUILD_SHA'],
              'tree_sha': os.environ['PM_BUILD_TREE'],
              'ref': os.environ['PM_BUILD_REF'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'workflow_sha': os.environ['GITHUB_SHA'],
              'python_version': os.environ['PM_PYTHON_VERSION'],
              'build_version': os.environ['PM_BUILD_VERSION'],
              'generated_at': os.environ['PM_GENERATED_AT'],
              'artifacts': sorted(p.name for p in dist.iterdir() if p.is_file()),
          }
          text = json.dumps(info, indent=2, sort_keys=True) + '\n'
          dist.joinpath('BUILD-INFO.json').write_text(text, encoding='utf-8')
          print(text)
          PY
      - name: Write sha256sums.txt
        shell: bash
        run: |
          set -euo pipefail
          (
            cd dist
            : > sha256sums.txt
            while IFS= read -r name; do
              # --text fixes the "<hex>  <name>" form (two spaces) on every
              # platform, matching the signed evidence manifests.
              sha256sum --text -- "$name" >> sha256sums.txt
            done < <(find . -maxdepth 1 -type f ! -name sha256sums.txt -printf '%P\n' | LC_ALL=C sort)
          )
          echo '## Artifact checksums' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/sha256sums.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # The bundle location is an *output* of this action, not an input, so the
      # next step copies it out of the runner temp directory.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ github.workspace }}/dist/*
      - name: Keep the attestation bundle
        shell: bash
        env:
          PM_BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${PM_BUNDLE_PATH}" ] || [ ! -f "${PM_BUNDLE_PATH}" ]; then
            echo "::error::attestation bundle 不在 output 给出的路径（bundle-path=${PM_BUNDLE_PATH:-<empty>}）；不谎称已生成"
            exit 1
          fi
          cp "${PM_BUNDLE_PATH}" attestation/attestation.json
          echo "- attestation bundle: $(wc -c < attestation/attestation.json) bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- attestation id: ${{ steps.attest.outputs.attestation-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- attestation url: ${{ steps.attest.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Checksum self-check
        shell: bash
        run: |
          set -uo pipefail
          ( cd dist && sha256sum -c -- sha256sums.txt )
          rc=$?
          echo "- \`sha256sum -c sha256sums.txt\` (in dist/) -> exit ${rc}" >> "$GITHUB_STEP_SUMMARY"
          exit "${rc}"
      - name: Attestation self-check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "- gh version: \`$(gh --version | head -1)\`" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for file in dist/*; do
            attempt=1
            while :; do
              gh attestation verify "${file}" --repo "${GITHUB_REPOSITORY}"
              rc=$?
              if [ "${rc}" -eq 0 ] || [ "${attempt}" -ge 5 ]; then
                break
              fi
              echo "attestation for ${file} not queryable yet (attempt ${attempt}/5); retrying in 10s"
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "- \`gh attestation verify ${file} --repo ${GITHUB_REPOSITORY}\` -> exit ${rc} after ${attempt} attempt(s)" >> "$GITHUB_STEP_SUMMARY"
            if [ "${rc}" -ne 0 ]; then
              echo "::error::gh attestation verify failed for ${file} after ${attempt} attempts"
              status=1
            fi
          done
          exit "${status}"
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts-${{ env.PM_SHORT_SHA }}
          path: |
            dist/*
            attestation/*
          retention-days: 90
          if-no-files-found: error
