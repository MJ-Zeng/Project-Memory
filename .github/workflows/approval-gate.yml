name: approval-gate

on:
  # pull_request_target runs the workflow from base, with secrets available.
  # The PR head is never checked out or executed: only its SHA is passed to the
  # verifier as a string.  Do not add a `pull_request` trigger: a PR could run
  # a tampered copy of this workflow under the same check name.
  pull_request_target:
    branches: [dev/v1.0]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to gate
        required: true

permissions:
  contents: read

concurrency:
  group: approval-gate-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  approval:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || 'dev/v1.0' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: resolve head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_HEAD:-}" ]; then
            PM_HEAD="$EVENT_HEAD"
          else
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
            echo "::add-mask::$auth"
            git -c http.extraheader="AUTHORIZATION: basic $auth" \
              fetch -q origin "refs/pull/$PR_NUMBER/head"
            PM_HEAD=$(git rev-parse 'FETCH_HEAD^{commit}')
          fi
          if ! printf '%s\n' "$PM_HEAD" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::无法解析 PR head 提交：$PM_HEAD"
            exit 1
          fi
          echo "PM_HEAD=$PM_HEAD" >> "$GITHUB_ENV"
      - name: fetch approvals branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A missing branch fails here instead of silently approving nothing.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            fetch -q origin approvals:refs/remotes/origin/approvals
      - name: verify approval
        shell: bash
        env:
          PROJECT_MEMORY_APPROVAL_ANCHOR_JSON: ${{ secrets.PROJECT_MEMORY_APPROVAL_ANCHOR_JSON }}
        run: |
          set -uo pipefail
          mkdir -p .pm-approvals
          git --work-tree=.pm-approvals checkout origin/approvals -- records || {
            echo "::error::approvals 分支缺少 records/；没有任何审批记录可用于该提交"
            exit 1
          }
          if [ -z "${PROJECT_MEMORY_APPROVAL_ANCHOR_JSON:-}" ]; then
            echo "::error::secrets.PROJECT_MEMORY_APPROVAL_ANCHOR_JSON 未配置；门禁没有审批信任锚"
            exit 1
          fi
          # The working tree is the base checkout, so this verifier and its
          # anchor checks are not affected by the PR.  Failure reasons printed
          # by the CLI cover: missing anchor, no record, record not matching
          # this commit, signature verification failure.
          python -m project_memory.cli approval verify \
            --records-dir .pm-approvals/records \
            --commit "$PM_HEAD" --require-approve
