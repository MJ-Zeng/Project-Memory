[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory-skill"
dynamic = ["version"]
description = "面向 GitHub 多 Agent 协作的项目记忆命令行工具与 Agent Skill"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]
dev = ["pytest==9.1.1"]

# NOTE: no [project.scripts] entry on purpose.  A pip "module:function"
# console_script resolves a top-level module through the ambient sys.path BEFORE
# any isolation, so PYTHONPATH/cwd can preempt it (B5A.1).  The trusted command
# is a native OS wrapper that isolates the interpreter (-I -P) first and then
# runs the launcher by absolute path.  See docs/decisions/ADR-0005-cli-bootstrap.md.

[tool.setuptools]
packages = ["project_memory"]
script-files = [
    "bin/project-memory",
    "bin/project-memory.cmd",
    "_project_memory_launcher.py",
]

[tool.setuptools.dynamic]
# 版本只有一个来源：project_memory.__version__。写死的第二份版本会与包元数据漂移，
# 而 evidence.py 把 __version__ 写进签名清单的 generator.version。
version = { attr = "project_memory.__version__" }

[tool.pytest.ini_options]
# 只收集正式测试；evidence/ 下的历史探针文件名也以 test_ 开头，
# 根目录 pytest 会因同名模块冲突而收集失败（B5B F-2）。
testpaths = ["tests"]
