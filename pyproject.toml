[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-memory-skill"
version = "0.1.0"
description = "面向 GitHub 多 Agent 协作的项目记忆命令行工具与 Agent Skill"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3"]

[project.scripts]
project-memory = "project_memory.cli:main"

[tool.setuptools]
packages = ["project_memory"]
